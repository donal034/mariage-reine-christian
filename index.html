<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reine &amp; Christian — Nouvelle adresse</title>
<meta http-equiv="refresh" content="2;url=https://mariage-reine-christian.pages.dev/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivoire:#FBF7EF;--sable:#EADFC9;
  --terracotta:#C2693F;--chocolat:#3E2417;--chocolat-doux:#5B3A28;
  --or:#B08D57;--or-pale:#D8C29A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Jost',sans-serif;font-weight:300;
  background:var(--ivoire);color:var(--chocolat);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.monogramme{
  width:96px;height:96px;border:1px solid var(--or);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:2.2rem;font-style:italic;
  color:var(--terracotta);margin-bottom:28px;position:relative;
}
.monogramme::after{
  content:'';position:absolute;inset:-9px;border:1px solid rgba(176,141,87,.35);border-radius:50%;
}
h1{
  font-family:'Fraunces',serif;font-weight:500;
  font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:14px;
}
p{color:var(--chocolat-doux);font-size:.98rem;max-width:420px;line-height:1.6;margin-bottom:28px}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--sable);border-top-color:var(--terracotta);
  animation:tourner .9s linear infinite;margin-bottom:22px;
}
@keyframes tourner{to{transform:rotate(360deg)}}
a.lien{
  display:inline-block;padding:14px 30px;border:1px solid var(--chocolat);border-radius:50px;
  color:var(--chocolat);text-decoration:none;
  font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;text-indent:.2em;
  transition:background .3s,color .3s;
}
a.lien:hover{background:var(--chocolat);color:var(--ivoire)}
</style>
</head>
<body>
<div class="monogramme">R&nbsp;&amp;&nbsp;C</div>
<h1>Notre site a une nouvelle adresse</h1>
<div class="spinner" aria-hidden="true"></div>
<p>Vous allez être redirigé(e) automatiquement dans un instant. Si rien ne se passe, cliquez sur le bouton ci-dessous.</p>
<a class="lien" id="lien-redirection" href="https://mariage-reine-christian.pages.dev/">Accéder au site</a>

<script>
/* Redirection JS immediate (le meta refresh ci-dessus sert de repli si
   JavaScript est desactive). Conserve les eventuels parametres d'URL
   (ex. ?c=CODE) au cas ou un ancien lien en contiendrait. */
var cible = "https://mariage-reine-christian.pages.dev/" + window.location.search;
document.getElementById("lien-redirection").href = cible;
window.location.replace(cible);
</script>
</body>
</html>
